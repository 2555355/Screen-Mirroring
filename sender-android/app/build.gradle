plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.screencast.sender'
    compileSdk 34

    defaultConfig {
        applicationId "com.screencast.sender"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // 在 CI 上用 debug 签名构建 release APK，产物可直接安装。
    // 如需正式签名，请把 keystore 信息放到 GitHub Secrets 后覆盖 signingConfig。
    signingConfigs {
        ciDebug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.ciDebug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.ciDebug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    // 二维码扫描（扫描接收端屏幕上的配对码二维码）
    // 用 4.2.0：IntentIntegrator 在该版本为稳定 API（4.3.0 起 deprecated）
    implementation 'com.journeyapps:zxing-android-embedded:4.2.0'
}
