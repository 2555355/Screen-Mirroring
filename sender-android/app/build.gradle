plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.screencast.sender'
    compileSdk 34

    defaultConfig {
        applicationId "com.screencast.sender"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // 在 CI 上用 debug 签名构建 release APK，产物可直接安装。
    // 如需正式签名，请把 keystore 信息放到 GitHub Secrets 后覆盖 signingConfig。
    signingConfigs {
        ciDebug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.ciDebug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.ciDebug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    // Camera1 API 已废弃会触发 lint warning，release 构建默认 checkReleaseBuilds=true
    // 会因 lint 报错失败，关闭 abortOnError 保证 release APK 正常产出
    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    // 二维码扫描：用 ZXing core 自实现扫码（与 TV 端生成二维码同库，避免引入 zxing-android-embedded 的兼容问题）
    implementation 'com.google.zxing:core:3.5.2'
}
